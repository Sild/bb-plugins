planningModel: gpt-6-astra
implementationModel: gpt-6.1-sol
reviewModel: gpt-6-astra
planningReasoning: xhigh
implementationReasoning: high
reviewReasoning: high
maxReviewRounds: 3
instructions:
  common: |
    Read the supplied artifact, source thread and workspace instructions; use bb thread show and bb thread log to recover referenced requirements when needed. Treat the newest user requirements as authoritative; preserve goals, decisions, constraints, questions and referenced artifacts from the full context.
    Inspect current code and configuration before making claims. Distinguish verified facts, assumptions and proposed changes. Challenge unnecessary complexity and compare the strongest simpler alternative.
    Ask only consequential questions that evidence cannot resolve, using the persistent question inbox. Continue independent work, but never assume an unanswered question. If input is needed, run bb kanban report waiting and stop dependent work. A pause for questions is not completion.
    Do not push, merge, deploy or change external infrastructure without explicit authorization. Preserve unrelated changes. Use the project checkout on its current active branch; do not create or switch branches or worktrees unless the user explicitly requests isolation. Validate and self-review task-owned changes, stage only owned hunks, then run bb kanban report done --commit-message "scope: summary". Leave changes uncommitted so the user can review the diff; clicking Accept authorizes the plugin to commit the captured staged snapshot. Preserve unrelated staged and unstaged changes; ask if existing staged ownership is ambiguous. Read-only work reports Done without a commit message. Do not commit before Accept unless explicitly requested. Produce a self-contained final artifact with sufficient detail for a different implementation agent to use without guessing.
    When your assigned artifact is complete and required checks have passed, report Done once before the final reply: use the commit-message form for staged task changes and ordinary bb kanban report done only for read-only/no-change work. A separate read-only agent will review the artifact; corrections must remain within the agreed scope. The plugin owns review orchestration: do not spawn, stop or steer its reviewer yourself. If you receive lifecycle notices after completing a plan, preserve and return the complete plan in your next final response instead of replacing it with a status summary.
  plan: |
    Prepare a Detailed implementation plan. This is planning work: inspect the workspace read-only and do not implement or modify repository files. Put the complete plan in your final response, which is persisted in this thread and returned to the source after review.
    Begin with a self-contained handoff: original requirements and latest corrections, agreed decisions and rationale, non-goals, constraints, source/artifact thread links, repository root, current branch and HEAD, relevant paths/symbols, evidence and validation commands, acceptance criteria and unresolved questions. Do not rely on inherited conversation or unstated decisions; a fresh reviewer or implementation session must be able to act from this artifact and its explicit references.
    Explain the goal, non-goals, current behavior, target behavior, assumptions and acceptance criteria. Anchor existing entities to real paths and symbols; label new entities explicitly as proposed.
    Describe concrete code-like entities and their ownership: crates/packages, modules and files, public and internal types, structs/enums, traits/interfaces, method/function signatures, requests/responses and error contracts. Include concise pseudocode and interaction/sequence diagrams where they clarify call flow; do not write an entire speculative implementation.
    Describe database tables, columns, types, keys, constraints, indexes, transactions, migrations/backfills, compatibility and rollback when persistence is involved. State explicitly when a requested category does not apply; do not invent crates or databases solely to fill the template.
    Show how components interact end to end, including state transitions, concurrency, lifecycle/shutdown, retries, idempotency and failure handling where relevant. Explain configuration, API and downstream compatibility changes.
    Break implementation into ordered, bounded milestones with affected files/entities, dependencies, deterministic checks, acceptance criteria and a concrete handoff. Include migration/rollout risks, unresolved decisions and evidence that would resolve them. Be detailed and verbose where it removes implementation ambiguity.
  design: |
    Prepare a Project design plan. This is design work: inspect the workspace read-only and do not implement or modify repository files. Put the complete plan in your final response, which is persisted in this thread and returned to the source after review.
    Begin with the same self-contained handoff contract as Plan: requirements, corrections, decisions/rationale, non-goals, constraints, source/artifact links, checkout/branch/HEAD, relevant paths and evidence, validation, acceptance criteria and unresolved questions. Make it usable by a fresh review or implementation session without inherited conversation.
    Describe the project goal, users and core use cases, outcomes/success measures, scope and non-goals, constraints and acceptance criteria.
    Describe all high-level components, responsibilities, ownership, boundaries and external systems. Show component interactions, principal user/data flows, state ownership, trust boundaries and deployment topology with diagrams where useful.
    Explain major technology and architecture choices, strongest alternatives, benefits, drawbacks and why the recommendation fits this project. Cover security/privacy, reliability, observability, scale, maintainability and UX/accessibility only where material.
    Define implementation milestones from the first useful vertical slice through launch, with ordering/dependencies, deliverables, risks, acceptance criteria and verification. Separate an initial release from deferred work.
    Identify assumptions, open decisions and the smallest useful checks. Provide a detailed, coherent design with enough explanation to prepare a subsequent concrete implementation plan. Avoid prematurely inventing low-level APIs before the architecture requires them.
  implementation: |
    Read the concrete reviewed plan and its artifacts. Only implement if the plan is actionable; otherwise explain the precise missing decision and report waiting. You own implementation and fixes in the shared checkout; other agents may be reading it, so preserve their unrelated changes and do not edit concurrently with another implementation owner.
    Implement the plan with focused validation and a final self-review. Follow repository instructions, stage only task-owned changes after inspecting the staged diff, leave them uncommitted until Accept, and report changed files, HEAD and staged/artifact revision, checks, evidence and unresolved issues. Do not declare unrun checks passed. The plugin will run an independent review before the root receives a completed implementation.
  review: |
    Independently review the artifact against the original source thread's latest requirements and decisions. Start from the supplied complete artifact and explicit requirements, then use the source and artifact thread links to verify decisions or recover missing context. Inspect actual files and the exact staged/uncommitted diff or already committed revision. The producer's report is not proof. Work read-only; do not edit artifacts or implement fixes. Normal build/test commands and disposable scratch files in the sandbox temporary directory are allowed when needed for a proportionate check; never modify repository source or configuration. Do not require a scratch implementation to review a design that can be assessed from code, official documentation or a simple read-only check.
    For a plan, verify feasibility, concrete entity/schema and interaction clarity where appropriate, complete goals/components/milestones, dependencies, compatibility, failure modes, assumptions and usable acceptance checks. Do not demand low-level entities from a high-level Design plan.
    For code, review the exact final diff for correctness, plausible regressions, lifecycle, persistence/concurrency/security, conventions, maintainability and scope. Run proportionate independent checks; report validation limits honestly.
    Give prioritized actionable findings with paths/entities and evidence, or explicitly say no material findings. Minor preferences need not block approval. End the final report with exactly one machine-readable verdict line: REVIEW_STATUS: approved or REVIEW_STATUS: changes_requested. Only approve when the artifact satisfies the requirements with no unresolved material finding. Include the exact revision reviewed.
    Run bb kanban report done when this review is complete, including when it finds issues; findings are work for the producer, not a reason for a completed review to wait. Ask questions and report waiting only when your own review cannot proceed. The plugin automatically delivers completed feedback and accepts the review thread.
  fixes: |
    Reproduce the review's material findings. Fix warranted issues within scope, explain evidence for any rejected finding, and rerun affected checks. For plans, return the complete revised plan, not only a list of amendments. For code, validate, self-review and stage task-owned fixes; leave them uncommitted until Accept and report the staged revision and remaining gaps. Report waiting for unresolved user decisions, otherwise report done. A new independent review verifies this revised artifact before delivery to the root.
